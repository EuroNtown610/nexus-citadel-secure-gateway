<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexxus Citadel Infrastructure Engine</title>
    <style>
        /* Modern Hacker Aesthetic Styling Layout */
        body {
            margin: 0;
            background-color: #0d0f12;
            font-family: 'Helvetica', sans-serif;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .interactive-3d-box {
            width: 100%;
            max-width: 800px;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: radial-gradient(circle, #1e293b 0%, #0d0f12 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
    </style>
    <!-- Import the Official Asynchronous Spline Viewer Runtime Module Engine -->
    <script type="module" src="https://unpkg.com"></script>
</head>
<body>
    <div class="app-container">
        <h1>Nexxus Citadel Immersive Interface</h1>
        
        <!-- Live Interactive Component Frame Layer -->
        <div class="interactive-3d-box">
            <!-- Replace the url attribute below with your production Spline Pro export link -->
            <spline-viewer url="https://spline.design"></spline-viewer>
        </div>
    </div>
</body>
</html>
