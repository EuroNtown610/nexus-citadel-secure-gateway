# ─── ⚡ PRODUCTION CACHE PATH DEFINITION ───
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=citadel_cache:10m max_size=1g inactive=60m use_temp_path=off;

upstream api_cluster {
    server sd_fastapi_core:8000 max_fails=3 fail_timeout=10s;
}

upstream wordpress_cluster {
    server sd_target_wordpress:80 max_fails=3 fail_timeout=10s;
}

server {
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    listen 80;
    server_name localhost;

    proxy_buffering off;

    # ─── 🛡️ EDGE ENFORCEMENT: XML-RPC DROP ROUTE ───
    location ~* /xmlrpc\.php {
        return 403;
    }

    # 🚨 ROOT PATHWAY MAP: Serves your FastAPI Cyberpunk Interface Natively
    location / {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🚨 ZERO-TRUST MUTUAL TLS INTERNAL NETWORK MESH INTERCEPT
    location /api/v1/ {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Enforce dynamic peer key handshakes across the docker virtual bridge driver
        proxy_ssl_certificate /workspace/certs/server.crt;
        proxy_ssl_certificate_key /workspace/certs/server.key;
        proxy_ssl_trusted_certificate /workspace/certs/ca.crt;
        proxy_ssl_verify on;
    }

    location /blog/ {
        proxy_pass http://wordpress_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
