server {
    listen 80;
    server_name localhost;

    # ─── ROUTE 1: SECURITY GATEWAY PASSTHROUGH ───
    location /api/v1/ {
        proxy_pass http://sd_fastapi_core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── ROUTE 2: PROTECTED CORPORATE CMS CORE ───
    location / {
        proxy_pass http://sd_target_wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
