server {
    listen 80;
    server_name localhost;

    # Disable buffering to prevent any network pipeline hanging
    proxy_buffering off;

    # ─── 🛡️ EDGE ENFORCEMENT: MITIGATE XML-RPC EXPLOITATION ───
    location ~* /xmlrpc\.php {
        return 403;
    }

    # ─── ROUTE 1: SECURITY GATEWAY PASSTHROUGH ───
    location /api/v1/ {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── ROUTE 2: PROTECTED CORPORATE CMS CORE ───
    location / {
        proxy_pass http://vulnerable-wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
