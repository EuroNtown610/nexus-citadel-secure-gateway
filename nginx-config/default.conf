# ─── ⚡ PRODUCTION CACHE PATH DEFINITION ───
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=citadel_cache:10m max_size=1g inactive=60m use_temp_path=off;

upstream api_cluster {
    server sd_fastapi_core:8000 max_fails=3 fail_timeout=10s;
}

upstream wordpress_cluster {
    server sd_target_wordpress:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    proxy_buffering off;

    # ─── 🛡️ SECURITY HEADER HARDENING LAYER ───
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 🚨 ROOT PASSTHROUGH MAP: Opens the FastAPI live landing board right at port 9095!
    location / {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Isolated environment endpoints
    location /api/v1/ {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /blog/ {
        proxy_pass http://wordpress_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
