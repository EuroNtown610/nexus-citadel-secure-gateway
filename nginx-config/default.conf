# ─── ⚡ PRODUCTION CACHE PATH DEFINITION ───
# Defines a 10MB memory zone that caches up to 1GB of data for 60 minutes
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=citadel_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ─── 🤖 LOAD BALANCING POOL CORPS ───
upstream api_cluster {
    server sd_fastapi_core:8000 max_fails=3 fail_timeout=10s;
}

upstream wordpress_cluster {
    server sd_target_wordpress:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Disable buffering for absolute real-time log parsing passthroughs
    proxy_buffering off;

    # ─── 🛡️ SECURITY HEADER HARDENING LAYER ───
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # ─── 🛡️ EDGE ENFORCEMENT: XML-RPC DROP ROUTE ───
    location ~* /xmlrpc\.php {
        return 403;
    }

    # ─── ROUTE 1: API GATEWAY WITH UPSTREAM BALANCING ───
    location /api/v1/ {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── ROUTE 2: CMS ASSETS WITH CONTENT CACHING ───
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://wordpress_cluster;
        proxy_set_header Host $host;
        
        # Cache Activation Mappings
        proxy_cache citadel_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── ROUTE 3: DEFAULT CMS CORE ROOT PASSTHROUGH ───
    location / {
        proxy_pass http://wordpress_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
