volumes:
  mongo_data:
  postgres_data:
  mysql_data:
  loki_data:
  grafana_data:
  smb_share_data:   # Persistent corporate data vault simulation

networks:
  sd_secure_network:
    driver: bridge

services:
  # ==========================================
  # HARDENED MASTER EDGE GATEWAY & PROXY
  # ==========================================
  nginx-edge-proxy:
    image: nginx:alpine
    container_name: sd_nginx_edge_proxy
    restart: always
    ports:
      - "9095:80"
    volumes:
      - ./nginx-config:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
    networks:
      - sd_secure_network
    depends_on:
      - backend-api
      - vulnerable-wordpress

  # ==========================================
  # ZONE 1: PROTECTED APPS & KALI PENTEST SANBOX
  # ==========================================
  backend-api:
    image: python:3.11-slim
    container_name: sd_fastapi_core
    restart: always
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - sd_secure_network
    command: sh -c "pip install --no-cache-dir fastapi uvicorn[standard] python-multipart motor bandit && uvicorn apps.main:app --host 0.0.0.0 --port 8000 --reload"

  kali-sandbox:
    image: kalilinux/kali-rolling:latest
    container_name: sd_kali_sandbox
    restart: always
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace
      - ./logs:/target_logs
    networks:
      - sd_secure_network
    command: sh -c "apt-get update && apt-get install -y curl nmap nikto dirb hydra ncrack sqlmap iproute2 smbclient cifs-utils & tail -f /dev/null"

  # ==========================================
  # LAB 5 SPECIFIC: CORPORATE SAMBA SHARE TARGET
  # ==========================================
  corporate-smb-share:
    image: dperson/samba:latest
    container_name: sd_corporate_smb
    restart: always
    ports:
      - "139:139"
      - "445:445"    # Standard Active Directory/Samba transport lane
    volumes:
      - smb_share_data:/mount
    networks:
      - sd_secure_network
    # Sets up a simulated financial share user 'operator' with password 'CitadelSecure2026!'
    command: -u "operator;CitadelSecure2026!" -s "Accounting;/mount;txt;no;no;operator"

  # ==========================================
  # ZONE 2: ENTERPRISE INFRASTRUCTURE ADDITIONS
  # ==========================================
  mysql-db:
    image: mysql:8.0
    container_name: sd_infra_mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sd_secure_network

  vulnerable-wordpress:
    image: wordpress:latest
    container_name: sd_target_wordpress
    ports:
      - "8085:80"
    networks:
      - sd_secure_network
    depends_on:
      - mysql-db

  # ==========================================
  # ZONE 3: SIEM MONITORING & ANALYSIS ARRAYS
  # ==========================================
  falco-kernel-monitor:
    image: falcosecurity/falco:latest
    container_name: sd_sys_falco
    restart: always
    privileged: true
    user: root
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - ./falco-config/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
    networks:
      - sd_secure_network
    command: ["falco", "-U", "-c", "/etc/falco/falco.yaml"]
