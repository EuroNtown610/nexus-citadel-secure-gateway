networks:
  dmz_public_net:
    driver: bridge
  app_isolated_net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  mysql_data:
  loki_data:

services:
  # ==========================================
  # THE EDGE GATEWAY (FACING THE WAN)
  # ==========================================
  nginx-edge-proxy:
    image: nginx:alpine
    container_name: sd_nginx_edge_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-config:/etc/nginx/conf.d:ro
    networks:
      - dmz_public_net
      - app_isolated_net
    depends_on:
      - backend-api
      - vulnerable-wordpress

  # ==========================================
  # ZONE 1: THE CORE APP STACK
  # ==========================================
  backend-api:
    image: python:3.11-slim
    container_name: sd_fastapi_core
    restart: always
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - app_isolated_net
    command: sh -c "pip install --no-cache-dir fastapi uvicorn[standard] python-multipart motor bandit && uvicorn apps.main:app --host 0.0.0.0 --port 8000 --reload"

  database-engine:
    image: mongo:4.4
    container_name: sd_mongo_engine
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_isolated_net

  vulnerable-target:
    image: bkimminich/juice-shop:latest
    container_name: sd_target_juiceshop
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app_isolated_net

  dvwa-target:
    image: vulnerables/web-dvwa:latest
    container_name: sd_target_dvwa
    restart: always
    ports:
      - "8081:80"
    networks:
      - app_isolated_net

  rogue-console:
    image: nginx:alpine
    container_name: sd_target_rogue_nginx
    restart: always
    ports:
      - "8082:80"
    networks:
      - app_isolated_net

  kali-sandbox:
    image: kalilinux/kali-rolling:latest
    container_name: sd_kali_sandbox
    restart: always
    tty: true
    stdin_open: true
    networks:
      - app_isolated_net
    volumes:
      - .:/workspace
      - ./logs:/target_logs
    command: sh -c "apt-get update && apt-get install -y curl nmap nikto dirb hydra ncrack & tail -f /dev/null"

  # ==========================================
  # ZONE 2: ENTERPRISE DEPLOYMENT ADDITIONS
  # ==========================================
  redis-cache:
    image: redis:alpine
    container_name: sd_infra_redis
    networks:
      - app_isolated_net

  postgres-db:
    image: postgres:alpine
    container_name: sd_infra_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123!
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_isolated_net

  mysql-db:
    image: mysql:8.0
    container_name: sd_infra_mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_isolated_net

  memcached-node:
    image: memcached:alpine
    container_name: sd_infra_memcached
    networks:
      - app_isolated_net

  vulnerable-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: sd_target_ssh
    environment:
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=Password123!
    networks:
      - app_isolated_net

  vulnerable-wordpress:
    image: wordpress:latest
    container_name: sd_target_wordpress
    networks:
      - app_isolated_net
    depends_on:
      - mysql-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ==========================================
  # ZONE 3: SIEM MONITORING, METRICS & LOKI LOGGING
  # ==========================================
  grafana-dashboard:
    image: grafana/grafana:latest
    container_name: sd_sys_grafana
    user: "root"
    ports:
      - "3001:3000"
    networks:
      - app_isolated_net

  prometheus-monitor:
    image: prom/prometheus:latest
    container_name: sd_sys_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app_isolated_net

  loki-logging:
    image: grafana/loki:2.9.0
    container_name: sd_sys_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_isolated_net

  promtail-shipper:
    image: grafana/promtail:2.9.0
    container_name: sd_sys_promtail
    user: "root"
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app_isolated_net
    depends_on:
      - loki-logging

  falco-kernel-monitor:
    image: falcosecurity/falco:latest
    container_name: sd_sys_falco
    restart: always
    privileged: true
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
    networks:
      - app_isolated_net

  # ==========================================
  # ZONE 4: SECURITY INTERCEPTION LABS
  # ==========================================
  network-sniffer:
    image: alpine:latest
    container_name: sd_sys_sniffer
    restart: always
    network_mode: "container:sd_target_wordpress"
    cap_add:
      - NET_ADMIN
    command: sh -c "apk add --no-cache tshark && tail -f /dev/null"
    depends_on:
      vulnerable-wordpress:
        condition: service_healthy
