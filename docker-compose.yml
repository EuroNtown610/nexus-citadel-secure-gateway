services:
  # --- 1. CORE BACKEND APPLICATION ENGINE ---
  backend-api:
    image: python:3.11-slim
    container_name: sd_fastapi_core
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - sd_secure_network
    depends_on:
      - database-engine
    command: sh -c "pip install --no-cache-dir fastapi uvicorn[standard] python-multipart motor && uvicorn apps.main:app --host 0.0.0.0 --port 8000 --reload"

  # --- 2. ASYNCHRONOUS NO-SQL DATA PLATFORM ---
  database-engine:
    image: mongo:4.4
    container_name: sd_mongo_engine
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sd_secure_network

  # --- 3. OWASP JUICE SHOP TARGET MACHINE ---
  vulnerable-target:
    image: bkimminich/juice-shop:latest
    container_name: sd_target_juiceshop
    restart: always
    ports:
      - "3000:3000"
    networks:
      - sd_secure_network

  # --- 4. 🔥 NEW TARGET: DAMNED VULNERABLE WEB APPLICATION (DVWA) ---
  dvwa-target:
    image: vulnerables/web-dvwa:latest
    container_name: sd_target_dvwa
    restart: always
    ports:
      - "8081:80"
    networks:
      - sd_secure_network

  # --- 5. 🔥 NEW TARGET: NGINX ROGUE WEB CONSOLE ---
  rogue-console:
    image: nginx:alpine
    container_name: sd_target_rogue_nginx
    restart: always
    ports:
      - "8082:80"
    networks:
      - sd_secure_network

  # --- 6. WEAPONIZED KALI SANBOX TERMINAL NODE ---
  kali-sandbox:
    image: kalilinux/kali-rolling:latest
    container_name: sd_kali_sandbox
    restart: always
    tty: true
    stdin_open: true
    networks:
      - sd_secure_network
    volumes:
      - .:/workspace
      - ./logs:/target_logs
    command: sh -c "apt-get update && apt-get install -y curl nmap nikto dirb hydra ncrack && tail -f /dev/null"

networks:
  sd_secure_network:
    driver: bridge

volumes:
  mongo_data:
