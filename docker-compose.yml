networks:
  sd_secure_network:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  mysql_data:
  loki_data:

services:
  # ==========================================
  # ZONE 1: THE CORE APP STACK
  # ==========================================
  backend-api:
    image: python:3.11-slim
    container_name: sd_fastapi_core
    environment:
      - MONGO_USER=db_admin_user
      - MONGO_PASS=SecureVaultPassword2026!
      - MONGO_HOST=database-core

  database-engine:
    image: mongo:4.4
    container_name: sd_mongo_engine
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sd_secure_network

  vulnerable-target:
    image: bkimminich/juice-shop:latest
    container_name: sd_target_juiceshop
    restart: always
    ports:
      - "3000:3000"
    networks:
      - sd_secure_network

  dvwa-target:
    image: vulnerables/web-dvwa:latest
    container_name: sd_target_dvwa
    restart: always
    ports:
      - "8081:80"
    networks:
      - sd_secure_network

  rogue-console:
    image: nginx:alpine
    container_name: sd_target_rogue_nginx
    restart: always
    ports:
      - "8082:80"
    networks:
      - sd_secure_network

  kali-sandbox:
    image: kalilinux/kali-rolling:latest
    container_name: sd_kali_sandbox
    restart: always
    tty: true
    stdin_open: true
    networks:
      - sd_secure_network
    volumes:
      - .:/workspace
      - ./logs:/target_logs
    command: sh -c "apt-get update && apt-get install -y curl nmap nikto dirb hydra ncrack & tail -f /dev/null"

  # ==========================================
  # ZONE 2: ENTERPRISE DEPLOYMENT ADDITIONS
  # ==========================================
  redis-cache:
    image: redis:alpine
    container_name: sd_infra_redis
    networks:
      - sd_secure_network

  postgres-db:
    image: postgres:alpine
    container_name: sd_infra_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123!
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - sd_secure_network

  mysql-db:
    image: mysql:8.0
    container_name: sd_infra_mysql
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sd_secure_network

  memcached-node:
    image: memcached:alpine
    container_name: sd_infra_memcached
    networks:
      - sd_secure_network

  vulnerable-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: sd_target_ssh
    environment:
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=Password123!
    networks:
      - sd_secure_network

  vulnerable-wordpress:
    image: wordpress:latest
    container_name: sd_target_wordpress
    ports:
      - "8085:80"
    networks:
      - sd_secure_network

  # ==========================================
  # ZONE 3: SIEM MONITORING, METRICS & LOKI LOGGING
  # ==========================================
  grafana-dashboard:
    image: grafana/grafana:latest
    container_name: sd_sys_grafana
    user: "root"
    ports:
      - "3001:3000"
    networks:
      - sd_secure_network

  prometheus-monitor:
    image: prom/prometheus:latest
    container_name: sd_sys_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sd_secure_network

  loki-logging:
    image: grafana/loki:2.9.0
    container_name: sd_sys_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sd_secure_network

    # Locate your promtail-shipper block and update the volumes path exactly like this:
  promtail-shipper:
    image: grafana/promtail:2.9.0
    container_name: sd_sys_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      # NEW WINDOWS ENGINE STORAGE PATH LINK:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sd_secure_network
